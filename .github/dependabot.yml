# Dependency update automation.
#
# Grouping policy: minor and patch bumps arrive as a single PR per ecosystem per
# week so the maintainers' merge train stays short. Major bumps are deliberately
# left out of the groups, so each one lands as its own PR and gets a real review.
#
# Cooldown policy: a new release is proposed only once it is 7 days old, which
# gives upstream time to catch a broken or compromised release before a PR
# offers it here. The cooldown applies to version updates only; Dependabot
# security updates are not delayed. 7 days is the shortest cooldown that
# zizmor's dependabot-cooldown audit accepts by default.

version: 2

updates:
  # Go module dependencies declared in go.mod.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Actions referenced by the workflows under .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Base images in the root Dockerfile. Its only base image, `FROM ubuntu`, has
  # no tag or digest, so it resolves to whatever ubuntu:latest is at build
  # time. Once the base image is pinned by tag and sha256 digest, this entry
  # keeps the pin current; without it, a digest pin would freeze the base image,
  # CVEs included.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
