# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"

jobs:
  check:
    runs-on: linux-amd64-cpu8
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: -v --timeout 5m
        skip-cache: true

    - name: vet
      run:
        make vet

    - name: fmt
      run:
        test -z "$(go fmt ./...)"

  test:
    runs-on: linux-amd64-cpu8
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Test
      run: go test -v -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        fail_ci_if_error: false
        verbose: true

  build:
    runs-on: linux-amd64-cpu8
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Build
      run: make build
  
  test-k8s:
    needs: [check, test, build]
    runs-on: linux-amd64-cpu8
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Build
      run: make build

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1

    - name: Install Helm
      uses: azure/setup-helm@v5

    - name: Run test scripts
      run: ./tests/ci/test_k8s.sh

  govulncheck:
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'
        cache: true

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  dco:
    runs-on: linux-amd64-cpu8
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    # Bots like dependabot cannot sign off, so their commits are exempt.
    - name: Check DCO sign-off
      run: |
        missing=$(git log --no-merges --format='%h %ae%x09%(trailers:key=Signed-off-by,valueonly,separator=;)' origin/main..HEAD \
          | awk -F'\t' '$2 == "" && $1 !~ /\[bot\]@/ {print $1}')
        if [ -n "$missing" ]; then
          echo "Commits missing Signed-off-by (use git commit -s):"
          echo "$missing"
          exit 1
        fi
