# Lints the GitHub Actions configuration whenever anything under .github/
# changes, and once a week so zizmor's online audits catch new advisories
# against the actions this repository already pins.
#
# actionlint checks workflow syntax, expressions, runner labels, and action
# inputs. It is blocking. Its configuration, including the self-hosted runner
# labels the other workflows use, lives in .github/actionlint.yaml.
#
# zizmor audits workflows and dependabot.yml for security problems such as
# template injection, excessive permissions, persisted credentials, and
# unpinned actions. It runs twice:
#   - The first run uploads every finding to code scanning as SARIF, including
#     the ones .github/zizmor.yml ignores, so those deferred findings stay
#     listed there as open alerts. It never fails on findings, and it comes
#     first so that a failing job has already uploaded its results.
#   - The second run applies .github/zizmor.yml and fails the job on any
#     finding that file does not ignore.
#
# Both tools are release binaries pinned by version and by the SHA-256 of the
# downloaded archive, recorded here rather than read from a checksums file in
# the same release. Dependabot does not track these pins: bump each version
# and its checksum together by hand.
#
# The jobs are light, so they run on GitHub-hosted runners.

name: Workflow Lint

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - '.github/**'
  schedule:
    # Mondays at 07:30 UTC.
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Clone the repository.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          # Bumped by hand together with ACTIONLINT_SHA256 (linux x86_64 archive);
          # not tracked by Dependabot.
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      - name: Run actionlint
        # The shellcheck and pyflakes integrations are turned off so the result
        # does not depend on which of those happen to be installed on the
        # runner image. Pass the same flags to a local run from the repository
        # root.
        run: '"${RUNNER_TEMP}/actionlint" -color -shellcheck= -pyflakes='

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Clone the repository, and let the SARIF upload read this workflow run.
      # GitHub documents both as needed only for private repositories, so
      # declare them rather than depend on this one staying public.
      contents: read
      actions: read
      # Upload the SARIF result to the code scanning dashboard.
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        env:
          # Bumped by hand together with ZIZMOR_SHA256 (linux x86_64 archive);
          # not tracked by Dependabot.
          ZIZMOR_VERSION: '1.31.1'
          ZIZMOR_SHA256: 'd185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99'
        run: |
          set -euo pipefail
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}"
          echo "${ZIZMOR_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" zizmor

      - name: Run zizmor for code scanning
        env:
          # Enables the online audits, which resolve action refs through the
          # GitHub API (impostor commits, ref confusion, known-vulnerable
          # actions). The token carries only this job's permissions.
          GH_TOKEN: ${{ github.token }}
        # --no-ignores also reports what .github/zizmor.yml ignores, and
        # --no-exit-codes keeps this run from failing on those findings. The
        # last step is the one that fails the job. See the header comment.
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/zizmor" --format sarif --no-ignores --no-exit-codes . > zizmor.sarif

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on findings not ignored in .github/zizmor.yml
        env:
          # The same online audits as the code scanning run.
          GH_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/zizmor" .'
