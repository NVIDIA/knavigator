# zizmor configuration, read by the zizmor job in workflows/workflow-lint.yaml.
#
# Every entry below ignores one rule in one file. Each covers a finding that
# was open in code scanning on main on 2026-11-23 and is deferred on purpose:
# docker.yml and release.yml publish the container image and the Helm charts,
# and their hardening waits for the maintainers' decision on how artifacts are
# built and released. Both files run only through workflow_dispatch.
#
# Any finding not listed here fails the zizmor job. Remove an entry when the
# file it names is fixed, so the same rule is enforced there again.

rules:
  artipacked:
    ignore:
      # actions/checkout leaves the job token in .git/config for later steps.
      # chart-releaser in release.yml pushes gh-pages with git, so check that
      # it still can before setting persist-credentials: false there.
      - docker.yml
      - release.yml

  cache-poisoning:
    ignore:
      # setup-go restores the Go module cache in a job that publishes an
      # image. Deferred with the rest of docker.yml.
      - docker.yml

  excessive-permissions:
    ignore:
      # No permissions block, so the job gets the default token. It needs
      # packages: write to push to GHCR; the exact set is part of the
      # artifacts discussion.
      - docker.yml

  unpinned-uses:
    ignore:
      # Actions referenced by tag (docker.yml 2, release.yml 3). Pinning them
      # by SHA is part of the same deferred change.
      - docker.yml
      - release.yml
