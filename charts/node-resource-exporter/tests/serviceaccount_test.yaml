suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
release:
  name: nre
  namespace: monitoring
chart:
  version: 0.0.0-dev
  appVersion: 0.0.0-dev
tests:
  - it: matches the default-values snapshot
    asserts:
      - matchSnapshot: {}

  - it: honours name, annotations and automount
    set:
      serviceAccount:
        name: custom
        automount: false
        annotations:
          a: b
    asserts:
      - equal:
          path: metadata.name
          value: custom
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.annotations.a
          value: b

  - it: renders nothing when create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0
