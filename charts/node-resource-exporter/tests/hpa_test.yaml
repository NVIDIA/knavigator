suite: hpa
templates:
  - templates/hpa.yaml
release:
  name: nre
  namespace: monitoring
chart:
  version: 0.0.0-dev
  appVersion: 0.0.0-dev
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders CPU target when enabled
    set:
      autoscaling:
        enabled: true
    asserts:
      - matchSnapshot: {}

  - it: adds a memory metric when configured
    set:
      autoscaling:
        enabled: true
        targetMemoryUtilizationPercentage: 70
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - equal:
          path: spec.metrics[1].resource.target.averageUtilization
          value: 70
