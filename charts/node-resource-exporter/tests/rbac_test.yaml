suite: rbac
templates:
  - templates/rbac.yaml
release:
  name: nre
  namespace: monitoring
chart:
  version: 0.0.0-dev
  appVersion: 0.0.0-dev
tests:
  - it: matches the default-values snapshot
    asserts:
      - matchSnapshot: {}

  - it: follows a custom service account name
    set:
      serviceAccount:
        name: custom
    asserts:
      - equal:
          path: metadata.name
          value: custom
        documentIndex: 0
      - equal:
          path: subjects[0].name
          value: custom
        documentIndex: 1
