name: test-k8s-mixed-nodes
description: place one 8-GPU job on an 8-GPU and a 4-GPU virtual node
tasks:
- id: register
  type: RegisterObj
  params:
    template: "resources/templates/k8s/job.yml"
    nameFormat: "job{{._ENUM_}}"
    podNameFormat: "{{._NAME_}}-[0-9]-.*"
    podCount: "{{.parallelism}}"
- id: configure
  type: Configure
  params:
    nodes:
    - type: dgxa100.80g
      count: 1
      labels:
        nvidia.com/gpu.count: "8"
    - type: gpu4
      count: 1
      resources:
        cpu: 32
        memory: 256Gi
        nvidia.com/gpu: 4
        pods: 110
      labels:
        nvidia.com/gpu.count: "4"
    timeout: 1m
- id: job
  type: SubmitObj
  params:
    refTaskId: register
    count: 1
    params:
      namespace: default
      parallelism: 1
      completions: 1
      backoffLimit: 0
      completionMode: Indexed
      image: ubuntu
      cpu: 100m
      memory: 512M
      gpu: 8
      ttl: "60s"
