name: test-k8s-trace
description: replay a recorded trace of k8s jobs from a CSV file
tasks:
- id: register
  type: RegisterObj
  params:
    template: "resources/templates/k8s/trace-job.yml"
    nameFormat: "trace{{.jobId}}"
    podNameFormat: "{{._NAME_}}-[0-9]+-.*"
    podCount: "{{.gangSize}}"
- id: configure
  type: Configure
  params:
    nodes:
    - type: dgxa100.80g
      count: 2
      labels:
        nvidia.com/gpu.count: "8"
    timeout: 1m
- id: trace
  type: SubmitTrace
  params:
    refTaskId: register
    file: resources/traces/trace.csv
    params:
      namespace: default
