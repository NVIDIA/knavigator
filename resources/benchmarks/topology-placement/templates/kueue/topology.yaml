# Kueue's Topology. The zone, block and rack levels are KAI's; kubernetes.io/hostname is a fourth level
# so that a job without a topology annotation, which Kueue places as unconstrained at the lowest level
# (Kueue v0.20.2 pkg/cache/scheduler/tas_flavor_snapshot.go:1749-1756), is placed host by host and
# drawn to the occupier's hosts, which have the least room. With rack as the lowest level it would take
# one empty rack.
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: "{{.name}}"
spec:
  levels:
  - nodeLabel: cloud.provider.com/topology-zone
  - nodeLabel: cloud.provider.com/topology-block
  - nodeLabel: cloud.provider.com/topology-rack
  - nodeLabel: kubernetes.io/hostname
