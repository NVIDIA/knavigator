# A ResourceFlavor bound to a Topology. topologyName cannot change once set
# (Kueue v0.20.2 apis/kueue/v1beta2/resourceflavor_types.go:48-49), so the flavor is this benchmark's own.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: "{{.name}}"
spec:
  nodeLabels:
    nvidia.com/gpu.count: "8"
  topologyName: "{{.topology}}"
