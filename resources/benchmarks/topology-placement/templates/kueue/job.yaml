# A job of the topology-placement benchmark. Kueue reads the topology annotation from the pod template
# (Kueue v0.20.2 site/content/en/docs/tasks/run/topology_aware_scheduling.md:70-71) and accepts at most
# one per PodSet (pkg/controller/jobframework/tas_validation.go:43-58). A job without one is still placed
# by TAS, as unconstrained, because every flavor of its ClusterQueue is a TAS flavor
# (pkg/scheduler/flavorassigner/tas_flavorassigner.go:256-265).
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{._NAME_}}"
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: topology-placement
spec:
  suspend: true
  completions: {{.replicas}}
  parallelism: {{.replicas}}
  completionMode: NonIndexed
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: {{.ttl}}
        pod-complete.stage.kwok.x-k8s.io/jitter-delay: {{.ttl}}
        {{- if .preferred }}
        kueue.x-k8s.io/podset-preferred-topology: "{{.preferred}}"
        {{- end }}
        {{- if .required }}
        kueue.x-k8s.io/podset-required-topology: "{{.required}}"
        {{- end }}
    spec:
      nodeSelector:
        type: kwok
        {{- if .occupier }}
        knavigator.nvidia.com/occupier: "true"
        {{- end }}
      tolerations:
      - key: kwok.x-k8s.io/node
        operator: Exists
        effect: NoSchedule
      containers:
      - name: test
        image: ubuntu
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 100m
            memory: 256M
            nvidia.com/gpu: "{{.gpu}}"
          requests:
            cpu: 100m
            memory: 256M
            nvidia.com/gpu: "{{.gpu}}"
      restartPolicy: Never
