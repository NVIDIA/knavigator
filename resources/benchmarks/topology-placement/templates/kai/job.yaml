# A job of the topology-placement benchmark. KAI reads the topology annotations from the Job, its top
# owner (KAI v0.19.0 pkg/podgrouper/podgrouper/plugins/constants/constants.go:24-26,
# plugins/defaultgrouper/default_grouper.go:86-89). A job without a level gets none of the three, as
# KAI rejects a topology name without a level. batch-min-member makes the job a gang, so the topology
# plugin places all its pods in one allocation. No kai.scheduler/background label: it would make the
# pods evictable for placement.
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{._NAME_}}"
  namespace: default
  annotations:
    kai.scheduler/batch-min-member: "{{.replicas}}"
    {{- if or .preferred .required }}
    kai.scheduler/topology: topology-placement
    {{- end }}
    {{- if .preferred }}
    kai.scheduler/topology-preferred-placement: "{{.preferred}}"
    {{- end }}
    {{- if .required }}
    kai.scheduler/topology-required-placement: "{{.required}}"
    {{- end }}
spec:
  completions: {{.replicas}}
  parallelism: {{.replicas}}
  template:
    metadata:
      labels:
        kai.scheduler/queue: topology-placement-jobs
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: {{.ttl}}
        pod-complete.stage.kwok.x-k8s.io/jitter-delay: {{.ttl}}
    spec:
      schedulerName: kai-scheduler
      nodeSelector:
        type: kwok
        {{- if .occupier }}
        knavigator.nvidia.com/occupier: "true"
        {{- end }}
      tolerations:
      - key: kwok.x-k8s.io/node
        operator: Exists
        effect: NoSchedule
      containers:
      - name: test
        image: busybox
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 100m
            memory: 250M
            nvidia.com/gpu: "{{.gpu}}"
          requests:
            cpu: 100m
            memory: 250M
            nvidia.com/gpu: "{{.gpu}}"
      restartPolicy: Never
