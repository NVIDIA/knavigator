# KAI's Topology, with the three levels of KAI v0.19.0's scale test (test/e2e/scale/topology/topology.go:32-53),
# top level first and no hostname level.
apiVersion: kai.scheduler/v1alpha1
kind: Topology
metadata:
  name: "{{.name}}"
spec:
  levels:
  - nodeLabel: cloud.provider.com/topology-zone
  - nodeLabel: cloud.provider.com/topology-block
  - nodeLabel: cloud.provider.com/topology-rack
