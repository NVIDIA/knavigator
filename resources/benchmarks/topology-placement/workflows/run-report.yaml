name: run-report
description: on the emptied cluster, run an unconstrained job and an oversized one, recorded but not checked
tasks:
# Nothing here checks where a job lands: -results records every pod's node, and the README says how to
# read the spread. Both jobs run once the occupier has finished, on an empty cluster as in KAI v0.19.0's
# scale test, the unconstrained one first.
- id: occupier-done
  type: CheckPod
  params:
    refTaskId: occupier
    status: Succeeded
    timeout: 8m
# As between the checked jobs, the sleep lets the scheduler release the finished occupier. Without
# it, a Kueue run's unconstrained job, submitted as the occupier's last pod finished, went to the
# occupier's nodes, one pod each, as if the occupier still held them.
- id: occupier-settle
  type: Sleep
  params:
    timeout: 10s
- id: unconstrained
  type: SubmitObj
  params:
    refTaskId: register
    params:
      job: u-unconstrained
      replicas: 20
      gpu: 2
      ttl: 30s
- id: unconstrained-done
  type: CheckPod
  params:
    refTaskId: unconstrained
    status: Succeeded
    timeout: 2m
- id: unconstrained-settle
  type: Sleep
  params:
    timeout: 10s
# KAI's scale test job, 512 pods of 2 GPUs preferring a rack (test/e2e/scale/kwok_test.go:225-232,
# kwok_workload_scenarios.go:45). Here it is 1024 GPUs, exactly one zone: it fits no rack or block,
# so a scheduler that honours the preference by falling back a level at a time fills one zone.
- id: oversized
  type: SubmitObj
  params:
    refTaskId: register
    params:
      job: o-oversized
      replicas: 512
      gpu: 2
      ttl: 60s
      preferred: cloud.provider.com/topology-rack
