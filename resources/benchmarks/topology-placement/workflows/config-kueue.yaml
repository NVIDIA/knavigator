name: config-kueue
description: create Kueue's four-level Topology, a flavor bound to it and a queue, and register the job
tasks:
- id: register-topology
  type: RegisterObj
  params:
    template: "resources/benchmarks/topology-placement/templates/kueue/topology.yaml"
- id: register-resource-flavor
  type: RegisterObj
  params:
    template: "resources/benchmarks/topology-placement/templates/kueue/resource-flavor.yaml"
- id: register-cluster-queue
  type: RegisterObj
  params:
    template: "resources/templates/kueue/cluster-queue.yaml"
- id: register-local-queue
  type: RegisterObj
  params:
    template: "resources/templates/kueue/local-queue.yaml"
# A name format makes SubmitObj record each job's name; the checks find a job's pods by it.
- id: register
  type: RegisterObj
  params:
    template: "resources/benchmarks/topology-placement/templates/kueue/job.yaml"
    nameFormat: "{{.job}}"
    podNameFormat: "{{._NAME_}}-[a-z0-9]+"
    podCount: "{{.replicas}}"
# The Topology, flavor and queue names are this benchmark's own, because canExist never updates an
# object that is already there.
- id: topology
  type: SubmitObj
  params:
    refTaskId: register-topology
    canExist: true
    params:
      name: topology-placement
- id: resource-flavor
  type: SubmitObj
  params:
    refTaskId: register-resource-flavor
    canExist: true
    params:
      name: topology-placement
      topology: topology-placement
# The flavor is the ClusterQueue's only one, so every job in it is placed by TAS. The quota holds the
# whole cluster, 2048 GPUs, so only the nodes' free room decides where a job goes, and the largest job,
# 512 pods of 100m CPU and 256M memory, fits the CPU, memory and pod quotas. Every job has the same
# priority, so none preempts another.
- id: cluster-queue
  type: SubmitObj
  params:
    refTaskId: register-cluster-queue
    canExist: true
    params:
      name: topology-placement
      flavor: topology-placement
      cpu: 256
      memory: 1Ti
      pods: 1024
      gpu: 2048
- id: local-queue
  type: SubmitObj
  params:
    refTaskId: register-local-queue
    canExist: true
    params:
      name: topology-placement
      namespace: default
      clusterQueue: topology-placement
