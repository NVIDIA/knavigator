name: config-kai
description: create KAI's three-level Topology and a queue, and register the job
tasks:
- id: register-topology
  type: RegisterObj
  params:
    template: "resources/benchmarks/topology-placement/templates/kai/topology.yaml"
- id: register-queue
  type: RegisterObj
  params:
    template: "resources/templates/kai/queue.yaml"
# A name format makes SubmitObj record each job's name; the checks find a job's pods by it.
- id: register
  type: RegisterObj
  params:
    template: "resources/benchmarks/topology-placement/templates/kai/job.yaml"
    nameFormat: "{{.job}}"
    podNameFormat: "{{._NAME_}}-[a-z0-9]+"
    podCount: "{{.replicas}}"
# The job template names this Topology. The Topology and queue names are this benchmark's own, because
# canExist never updates an object that is already there.
- id: topology
  type: SubmitObj
  params:
    refTaskId: register-topology
    canExist: true
    params:
      name: topology-placement
# No quota or limit: every job fits the queue, so only the nodes' free GPUs decide where it goes.
- id: parent-queue
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: topology-placement
- id: queue
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: topology-placement-jobs
      parentQueue: topology-placement
