apiVersion: batch/v1
kind: Job
metadata:
  name: "{{._NAME_}}"
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: team-queue
  annotations:
    kueue.x-k8s.io/job-group: group-{{._NAME_}}
spec:
  suspend: true
  completions: {{.gangSize}}
  parallelism: {{.gangSize}}
  completionMode: NonIndexed
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: {{.runtime}}
        pod-complete.stage.kwok.x-k8s.io/jitter-delay: {{.runtime}}
    spec:
      priorityClassName: trace-{{.priority}}
      containers:
      - name: test
        image: ubuntu
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 100m
            memory: 256M
            nvidia.com/gpu: "{{.gpus}}"
          requests:
            cpu: 100m
            memory: 256M
            nvidia.com/gpu: "{{.gpus}}"
      restartPolicy: Never
