name: config-nodes
description: 64 GPU nodes and the trace's priority classes
tasks:
- id: configure
  type: Configure
  params:
    nodes:
    - type: dgxa100.80g
      count: 64
      labels:
        nvidia.com/gpu.count: "8"
    priorityClasses:
    - name: trace-50
      value: 50
      op: create
    - name: trace-100
      value: 100
      op: create
    - name: trace-500
      value: 500
      op: create
    timeout: 1m
