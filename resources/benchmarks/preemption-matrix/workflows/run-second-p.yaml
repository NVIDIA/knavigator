name: run-second-p
description: submit the second job of pairs 1, 4 and 7, where both jobs are preemptible
tasks:
# The second job runs for 3 minutes, well past the hold, so a pair that preempts still shows its
# second job Running at the check.
- id: second-1
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 1
      role: second
      priorityClassName: pm-high-p
      replicas: 1
      gpu: 1
      ttl: 3m
- id: second-4
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 4
      role: second
      priorityClassName: pm-low-p
      replicas: 1
      gpu: 1
      ttl: 3m
- id: second-7
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 7
      role: second
      priorityClassName: pm-low-p
      replicas: 1
      gpu: 1
      ttl: 3m
