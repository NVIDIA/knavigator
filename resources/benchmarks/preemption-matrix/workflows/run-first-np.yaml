name: run-first-np
description: submit the first job of pairs 2, 3, 5, 6 and 8, where at least one job is non-preemptible, then wait until each runs
tasks:
# The first job runs for 5 minutes, well past the check after the second job's hold, so a pair that
# does not preempt still shows its first job Running.
- id: first-2
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 2
      role: first
      priorityClassName: pm-low-p
      replicas: 1
      gpu: 1
      ttl: 5m
- id: first-3
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 3
      role: first
      priorityClassName: pm-low-np
      replicas: 1
      gpu: 1
      ttl: 5m
- id: first-5
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 5
      role: first
      priorityClassName: pm-high-np
      replicas: 1
      gpu: 1
      ttl: 5m
- id: first-6
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 6
      role: first
      priorityClassName: pm-high-np
      replicas: 1
      gpu: 1
      ttl: 5m
- id: first-8
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 8
      role: first
      priorityClassName: pm-low-np
      replicas: 1
      gpu: 1
      ttl: 5m
# Each first job must be Running before any second job arrives.
- id: first-2-running
  type: CheckPod
  params:
    refTaskId: first-2
    status: Running
    timeout: 3m
- id: first-3-running
  type: CheckPod
  params:
    refTaskId: first-3
    status: Running
    timeout: 3m
- id: first-5-running
  type: CheckPod
  params:
    refTaskId: first-5
    status: Running
    timeout: 3m
- id: first-6-running
  type: CheckPod
  params:
    refTaskId: first-6
    status: Running
    timeout: 3m
- id: first-8-running
  type: CheckPod
  params:
    refTaskId: first-8
    status: Running
    timeout: 3m
