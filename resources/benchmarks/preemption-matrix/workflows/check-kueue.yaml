name: check-kueue
description: check what Kueue did to the job that lost each pair, once, after the hold
tasks:
# Kueue never creates a pod for a Job it has not admitted, and preempts by suspending the Job
# (Kueue v0.20.2 pkg/controller/jobs/job/job_controller.go:170-172), so these checks read the Job.
# Pair 1's first job was preempted; the second jobs of pairs 4 and 7 were never admitted.
- id: pair1-first
  type: CheckObj
  params:
    refTaskId: first-1
    state:
      spec:
        suspend: ${pair1_first_suspend:-true}
- id: pair4-second
  type: CheckObj
  params:
    refTaskId: second-4
    state:
      spec:
        suspend: ${pair4_second_suspend:-true}
- id: pair7-second
  type: CheckObj
  params:
    refTaskId: second-7
    state:
      spec:
        suspend: ${pair7_second_suspend:-true}
