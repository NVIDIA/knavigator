name: check-kai
description: check what KAI did to the job that lost each pair, once, after the hold
tasks:
# KAI preempts by deleting the victim's pod (KAI v0.19.0 pkg/scheduler/cache/evictor/default_evictor.go:41),
# and the Job controller creates a replacement, which waits Pending in the pair's full queue. A
# non-preempting pair's second pod also waits Pending. Each check reads the job's one pod.
- id: pair1-first
  type: CheckPod
  params:
    refTaskId: first-1
    status: ${pair1_first_status:-Pending}
- id: pair2-first
  type: CheckPod
  params:
    refTaskId: first-2
    status: ${pair2_first_status:-Pending}
- id: pair3-second
  type: CheckPod
  params:
    refTaskId: second-3
    status: ${pair3_second_status:-Pending}
- id: pair4-second
  type: CheckPod
  params:
    refTaskId: second-4
    status: ${pair4_second_status:-Pending}
- id: pair5-second
  type: CheckPod
  params:
    refTaskId: second-5
    status: ${pair5_second_status:-Pending}
- id: pair6-second
  type: CheckPod
  params:
    refTaskId: second-6
    status: ${pair6_second_status:-Pending}
- id: pair7-second
  type: CheckPod
  params:
    refTaskId: second-7
    status: ${pair7_second_status:-Pending}
- id: pair8-second
  type: CheckPod
  params:
    refTaskId: second-8
    status: ${pair8_second_status:-Pending}
