name: config-kai
description: register the pair job and create a parent KAI queue with one 1-GPU queue per pair
tasks:
- id: register-queue
  type: RegisterObj
  params:
    template: "resources/benchmarks/preemption-matrix/templates/kai/queue.yaml"
# A name format makes SubmitObj record each job's name; the checks find a pair's pod by it.
- id: register
  type: RegisterObj
  params:
    template: "resources/benchmarks/preemption-matrix/templates/kai/job.yaml"
    nameFormat: "pair{{.pair}}-{{.role}}"
    podNameFormat: "{{._NAME_}}-[a-z0-9]+"
    podCount: 1
# No GPU quota or limit on the parent: KAI checks quota and limit on every ancestor, and up to five
# non-preemptible jobs run at once. The queue names are this benchmark's own, because canExist never
# updates a queue that is already there.
- id: parent-queue
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: preemption-matrix
      gpu: -1
# GPU quota = limit = 1 per pair, so a pair's second job fits only if it preempts the first.
- id: queue-1
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: preemption-matrix-1
      parentQueue: preemption-matrix
      gpu: 1
- id: queue-2
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: preemption-matrix-2
      parentQueue: preemption-matrix
      gpu: 1
- id: queue-3
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: preemption-matrix-3
      parentQueue: preemption-matrix
