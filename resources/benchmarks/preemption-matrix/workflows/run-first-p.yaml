name: run-first-p
description: submit the first job of pairs 1, 4 and 7, where both jobs are preemptible, then wait until each runs
tasks:
# The first job runs for 5 minutes, well past the check after the second job's hold, so a pair that
# does not preempt still shows its first job Running.
- id: first-1
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 1
      role: first
      priorityClassName: pm-low-p
      replicas: 1
      gpu: 1
      ttl: 5m
- id: first-4
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 4
      role: first
      priorityClassName: pm-high-p
      replicas: 1
      gpu: 1
      ttl: 5m
- id: first-7
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: 7
      role: first
      priorityClassName: pm-low-p
      replicas: 1
      gpu: 1
      ttl: 5m
# Each first job must be Running before any second job arrives.
- id: first-1-running
  type: CheckPod
  params:
    refTaskId: first-1
    status: Running
    timeout: 3m
- id: first-4-running
  type: CheckPod
  params:
    refTaskId: first-4
    status: Running
    timeout: 3m
- id: first-7-running
  type: CheckPod
  params:
    refTaskId: first-7
    status: Running
    timeout: 3m
