name: run-hold
description: give every pair time to preempt, then the checks look once
tasks:
# 60 seconds after the last second job is created, which leaves 2 minutes of the second job's 3 and
# about 4 of the first job's 5 when the checks run.
- id: hold
  type: Sleep
  params:
    timeout: 60s
