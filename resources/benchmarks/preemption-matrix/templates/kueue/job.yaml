# One job of a preemption pair, in the pair's own LocalQueue. Kueue takes the job's priority from
# the pod template's PriorityClass.
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{._NAME_}}"
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: "preemption-matrix-{{.pair}}"
  annotations:
    kueue.x-k8s.io/job-group: group-{{._NAME_}}
spec:
  suspend: true
  completions: {{.replicas}}
  parallelism: {{.replicas}}
  completionMode: NonIndexed
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: {{.ttl}}
        pod-complete.stage.kwok.x-k8s.io/jitter-delay: {{.ttl}}
    spec:
      priorityClassName: {{.priorityClassName}}
      nodeSelector:
        type: kwok
      tolerations:
      - key: kwok.x-k8s.io/node
        operator: Exists
        effect: NoSchedule
      containers:
      - name: test
        image: ubuntu
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 100m
            memory: 256M
            nvidia.com/gpu: "{{.gpu}}"
          requests:
            cpu: 100m
            memory: 256M
            nvidia.com/gpu: "{{.gpu}}"
      restartPolicy: Never
