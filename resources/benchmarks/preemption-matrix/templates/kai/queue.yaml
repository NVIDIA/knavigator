# A KAI queue whose GPU quota and limit are both the gpu param; -1 means unlimited. CPU and memory stay
# unlimited: a finite CPU or memory quota would put a non-preemptible job over quota on that resource.
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: "{{.name}}"
spec:
  {{- if .parentQueue }}
  parentQueue: "{{.parentQueue}}"
  {{- end }}
  resources:
    cpu:
      quota: -1
      limit: -1
      overQuotaWeight: 1
    gpu:
      quota: {{.gpu}}
      limit: {{.gpu}}
      overQuotaWeight: 1
    memory:
      quota: -1
      limit: -1
      overQuotaWeight: 1
