name: run-window
description: wait until well inside the delayed pair's window, then the window checks look once
tasks:
# 30 seconds after the last second job is created: inside the first half of the 90 s window, the half
# KAI's test checks (preempt_delay_specs.go:97-103), and long after the control pair preempts (about
# 2 s on the test bed).
- id: window
  type: Sleep
  params:
    timeout: ${window_sleep:-30s}
