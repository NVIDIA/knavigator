name: check-post-window
description: check the delayed pair once, after its window
tasks:
# No timeout, so each check reads the pods once. After the window the delayed second job has
# preempted the first: it runs, and the first job's pod is the replacement, waiting Pending.
- id: post-delayed-second
  type: CheckPod
  params:
    refTaskId: second-delayed
    status: ${post_delayed_second_status:-Running}
- id: post-delayed-first
  type: CheckPod
  params:
    refTaskId: first-delayed
    status: ${post_delayed_first_status:-Pending}
