name: run-first
description: submit the first job of both pairs, then wait until each runs
tasks:
# The first job runs for 5 minutes from when its pod starts, past the post-window check, so a delayed
# first job still Running inside the window was not preempted, and one Pending after the window is the
# replacement for a preempted pod, not a job that ended on its own.
- id: first-delayed
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: delayed
      role: first
      priorityClassName: pd-low
      replicas: 1
      gpu: 1
      ttl: ${first_ttl:-5m}
- id: first-control
  type: SubmitObj
  params:
    refTaskId: register
    params:
      pair: control
      role: first
      priorityClassName: pd-low
      replicas: 1
      gpu: 1
      ttl: ${first_ttl:-5m}
# Each first job must be Running before any second job arrives.
- id: first-delayed-running
  type: CheckPod
  params:
    refTaskId: first-delayed
    status: Running
    timeout: 3m
- id: first-control-running
  type: CheckPod
  params:
    refTaskId: first-control
    status: Running
    timeout: 3m
