name: config-kai
description: register the pair job and create a parent KAI queue with one 1-GPU queue per pair
tasks:
- id: register-queue
  type: RegisterObj
  params:
    template: "resources/benchmarks/preemption-delay/templates/kai/queue.yaml"
# A name format makes SubmitObj record each job's name; the checks find a pair's pod by it.
- id: register
  type: RegisterObj
  params:
    template: "resources/benchmarks/preemption-delay/templates/kai/job.yaml"
    nameFormat: "{{.pair}}-{{.role}}"
    podNameFormat: "{{._NAME_}}-[a-z0-9]+"
    podCount: 1
# No GPU quota or limit on the parent: KAI checks quota and limit on every ancestor. The queue names
# are this benchmark's own, because canExist never updates a queue that is already there.
- id: parent-queue
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: preemption-delay
      gpu: -1
# GPU quota = limit = 1 per pair, so a pair's second job fits only if it preempts the first. KAI's
# allocate action ignores the delay (it sets no FilterWithinPreemptionDelay,
# pkg/scheduler/actions/allocate/allocate.go:50-54), so the limit, not the delay, is what keeps the
# delayed second job off a free GPU.
- id: queue-delayed
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: preemption-delay-delayed
      parentQueue: preemption-delay
      gpu: 1
- id: queue-control
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: preemption-delay-control
      parentQueue: preemption-delay
      gpu: 1
