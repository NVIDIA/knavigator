name: config-priorities
description: the two priority classes of the preemption-delay pairs
tasks:
# The classes must exist before any job: KAI gives a pod whose PriorityClass is missing its default
# class instead. Values follow KAI v0.19.0's preemption-delay test
# (test/e2e/suites/preempt/preempt_delay_specs.go:51-62): both below KAI's preemptible threshold of
# 100, high = low + 1. A PriorityClass value cannot change, so run on a fresh cluster.
- id: priorities
  type: Configure
  params:
    priorityClasses:
    - name: pd-low
      value: ${priority_low:-40}
      op: create
    - name: pd-high
      value: ${priority_high:-41}
      op: create
    timeout: 1m
