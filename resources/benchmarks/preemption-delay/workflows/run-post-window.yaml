name: run-post-window
description: wait until after the delayed pair's window, then the post-window checks look once
tasks:
# 90 seconds more, so 120 s after the last second job is created: the 90 s window, counted from the
# PodGroup's creation less than 1 s after submission, has ended. On the test bed the delayed second job
# started 29 s and the first job's replacement pod appeared 20 s before the check. The second job's
# 3 minutes and the replacement's wait reach well past the check.
- id: post-window
  type: Sleep
  params:
    timeout: ${post_window_sleep:-90s}
