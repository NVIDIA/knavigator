# One job of a preemption-delay pair, in the pair's own queue. The preemptionDelay param, when set,
# goes on the pod template: KAI v0.19.0's podgrouper reads kai.scheduler/preemption-delay from the
# Job and then from the pod, and copies the first valid value into the PodGroup's
# spec.preemptionDelay, the only place the scheduler reads it
# (pkg/podgrouper/podgrouper/plugins/defaultgrouper/default_grouper.go:278-298,
# pkg/podgrouper/podgroup/handler.go:109). Without the param the key is left out.
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{._NAME_}}"
  namespace: "default"
  annotations:
    kai.scheduler/batch-min-member: "{{.replicas}}"
spec:
  completions: {{.replicas}}
  parallelism: {{.replicas}}
  template:
    metadata:
      labels:
        kai.scheduler/queue: "preemption-delay-{{.pair}}"
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: {{.ttl}}
        pod-complete.stage.kwok.x-k8s.io/jitter-delay: {{.ttl}}
        {{- if .preemptionDelay }}
        kai.scheduler/preemption-delay: "{{.preemptionDelay}}"
        {{- end }}
    spec:
      schedulerName: kai-scheduler
      priorityClassName: {{.priorityClassName}}
      nodeSelector:
        type: kwok
      tolerations:
      - key: kwok.x-k8s.io/node
        operator: Exists
        effect: NoSchedule
      containers:
      - name: test
        image: busybox
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 100m
            memory: 250M
            nvidia.com/gpu: "{{.gpu}}"
          requests:
            cpu: 100m
            memory: 250M
            nvidia.com/gpu: "{{.gpu}}"
      restartPolicy: Never
