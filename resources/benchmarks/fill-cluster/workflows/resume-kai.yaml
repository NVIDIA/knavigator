name: resume-kai
description: check every pod stayed Pending while KAI was stopped, then start KAI
tasks:
# Only proves every pod exists: a new pod is Pending before any scheduler sees it.
- id: paused-created
  type: CheckPod
  params:
    refTaskId: submit
    status: Pending
    timeout: 5m
- id: hold
  type: Sleep
  params:
    timeout: 30s
# No timeout, so this checks every pod's current phase once, after the hold.
- id: paused
  type: CheckPod
  params:
    refTaskId: submit
    status: ${paused_status:-Pending}
- id: resume
  type: UpdateObj
  params:
    refTaskId: kai-config
    state:
      spec:
        scheduler:
          service:
            enabled: true
