name: run-submit
description: one single-GPU job per GPU in the cluster
tasks:
# ttl is longer than a 256-node fill took, so no pod finishes before the last one starts.
- id: submit
  type: SubmitObj
  params:
    refTaskId: register
    count: ${jobs:-2048}
    params:
      replicas: 1
      gpu: 1
      ttl: 6m
