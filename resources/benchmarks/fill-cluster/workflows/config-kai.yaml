name: config-kai
description: register the KAI queues, the single-GPU job and kai-config
tasks:
- id: register-queue
  type: RegisterObj
  params:
    template: "resources/templates/kai/queue.yaml"
- id: register
  type: RegisterObj
  params:
    template: "resources/benchmarks/fill-cluster/templates/kai/job.yaml"
    nameFormat: "fill{{._ENUM_}}"
    podNameFormat: "{{._NAME_}}-[a-z0-9]+"
    podCount: 1
- id: register-kai-config
  type: RegisterObj
  params:
    template: "resources/benchmarks/fill-cluster/templates/kai/config.yaml"
    # A name format makes SubmitObj record the name, which UpdateObj needs to patch kai-config.
    nameFormat: "{{.name}}"
- id: default-queue
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: default
- id: test-queue
  type: SubmitObj
  params:
    refTaskId: register-queue
    canExist: true
    params:
      name: test
      parentQueue: default
# kai-config exists already; this records its name for pause-kai.yaml and resume-kai.yaml.
- id: kai-config
  type: SubmitObj
  params:
    refTaskId: register-kai-config
    canExist: true
    params:
      name: kai-config
