name: config-kueue
description: register and create the Kueue queues, and register the single-GPU job
tasks:
- id: register-cluster-queue
  type: RegisterObj
  params:
    template: "resources/templates/kueue/cluster-queue.yaml"
    # A name format makes SubmitObj record the name, which UpdateObj needs to hold the ClusterQueue.
    nameFormat: "{{.name}}"
- id: register-local-queue
  type: RegisterObj
  params:
    template: "resources/templates/kueue/local-queue.yaml"
- id: register-resource-flavor
  type: RegisterObj
  params:
    template: "resources/templates/kueue/resource-flavor.yaml"
- id: register
  type: RegisterObj
  params:
    template: "resources/benchmarks/fill-cluster/templates/kueue/job.yaml"
    nameFormat: "fill{{._ENUM_}}"
    podNameFormat: "{{._NAME_}}-[a-z0-9]+"
    podCount: 1
- id: create-resource-flavor
  type: SubmitObj
  params:
    refTaskId: register-resource-flavor
    canExist: true
    params:
      name: "gpu-node"
      nodeLabels:
        nvidia.com/gpu.count: "8"
# Quota for every GPU in the cluster, with room for 2048 pods of 100m CPU and 256M memory.
# The queue names are this benchmark's own: canExist never updates a ClusterQueue that is already
# there, so sharing a name with another benchmark would run under that benchmark's quota.
- id: create-cluster-queue
  type: SubmitObj
  params:
    refTaskId: register-cluster-queue
    canExist: true
    params:
      name: fill
      flavor: gpu-node
      cpu: 256
      memory: 512Gi
      pods: 2048
      gpu: 2048
- id: create-local-queue
  type: SubmitObj
  params:
    refTaskId: register-local-queue
    canExist: true
    params:
      name: fill-queue
      namespace: default
      clusterQueue: fill
