name: config-nodes
description: 256 virtual GPU nodes with 8 GPUs each
tasks:
- id: configure
  type: Configure
  params:
    nodes:
    - type: dgxa100.80g
      count: 256
      labels:
        nvidia.com/gpu.count: "8"
      # Empty by default, so the chart sets no InternalIP; run scripts pass NODE_ADDRESS.
      address: "${node_address:-}"
    timeout: 5m
