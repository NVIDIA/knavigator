# Each pod of this Job becomes one Slurm job. slurm-bridge reads the Slurm settings from the Job's
# annotations. An empty gres keeps the pod's GPU request out of Slurm, which places whole nodes:
# the virtual nodes have no gres/gpu in Slurm. timeLimit is in minutes and must outlast ttl, or
# Slurm ends the job before KWOK completes the pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{._NAME_}}"
  namespace: "{{.namespace}}"
  annotations:
    slurmjob.slinky.slurm.net/gres: ""
    slurmjob.slinky.slurm.net/timelimit: "{{.timeLimit}}"
    {{- if .partition }}
    slurmjob.slinky.slurm.net/partition: "{{.partition}}"
    {{- end }}
    {{- if .priority }}
    slurmjob.slinky.slurm.net/priority: "{{.priority}}"
    {{- end }}
spec:
  completions: {{.replicas}}
  parallelism: {{.replicas}}
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: {{.ttl}}
        pod-complete.stage.kwok.x-k8s.io/jitter-delay: {{.ttl}}
    spec:
      schedulerName: slurm-bridge-scheduler
      containers:
      - name: test
        image: {{.image}}
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "{{.cpu}}"
            memory: {{.memory}}
            nvidia.com/gpu: "{{.gpu}}"
          requests:
            cpu: "{{.cpu}}"
            memory: {{.memory}}
            nvidia.com/gpu: "{{.gpu}}"
      restartPolicy: Never
