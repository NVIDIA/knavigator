# A Job for SubmitTrace: gangSize pods, each with gpus GPUs, running for the trace runtime.
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{._NAME_}}"
  namespace: "{{.namespace}}"
spec:
  backoffLimit: 0
  completions: {{.gangSize}}
  parallelism: {{.gangSize}}
  completionMode: Indexed
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: "{{.runtime}}"
        pod-complete.stage.kwok.x-k8s.io/jitter-delay: "{{.runtime}}"
    spec:
      schedulerName: default-scheduler
      containers:
      - name: test
        image: ubuntu
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: 100m
            memory: 256M
            nvidia.com/gpu: "{{.gpus}}"
          requests:
            cpu: 100m
            memory: 256M
            nvidia.com/gpu: "{{.gpus}}"
      restartPolicy: Never
