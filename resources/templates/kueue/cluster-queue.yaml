apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{.name}}
spec:
  namespaceSelector: {} # match all.
  {{- if .cohort }}
  cohortName: {{.cohort}}
  {{- end }}
  resourceGroups:
  - coveredResources: ["cpu", "memory", "pods", "nvidia.com/gpu"]
    flavors:
    - name: {{.flavor}}
      resources:
      - name: "cpu"
        nominalQuota: {{.cpu}}
      - name: "memory"
        nominalQuota: {{.memory}}
      - name: "pods"
        nominalQuota: {{.pods}}
      - name: "nvidia.com/gpu"
        nominalQuota: {{.gpu}}
  preemption:
    reclaimWithinCohort: Any
    borrowWithinCohort:
      policy: LowerPriority
      maxPriorityThreshold: 100
    withinClusterQueue: LowerPriority
