name: conformance-job-gang-k8s
description: a 3-pod gang with room for 2 pods places none with the default scheduler
tasks:
- id: register
  type: RegisterObj
  params:
    template: "../../templates/k8s/job.yml"
    nameFormat: "gang{{._ENUM_}}"
    podNameFormat: "{{._NAME_}}-.*"
    podCount: "{{.parallelism}}"
- id: configure
  type: Configure
  params:
    namespaces:
    - name: conformance
      op: create
    nodes:
    - type: dgxa100.80g
      count: 2
      labels:
        nvidia.com/gpu.count: "8"
    - type: dgxa100.80g
      count: 1
      labels:
        nvidia.com/gpu.count: "8"
        conformance/spare: "true"
    timeout: 1m
- id: cordon
  type: UpdateNodes
  params:
    selectors:
    - conformance/spare: "true"
    state:
      spec:
        unschedulable: true
- id: job
  type: SubmitObj
  params:
    refTaskId: register
    count: 1
    params:
      namespace: conformance
      parallelism: 3
      completions: 3
      backoffLimit: 0
      completionMode: Indexed
      image: ubuntu
      cpu: 100m
      memory: 250M
      gpu: 8
- id: settle
  type: Sleep
  params:
    timeout: 15s
- id: none-running
  type: CheckPod
  params:
    refTaskId: job
    status: Running
    count: 0
- id: uncordon
  type: UpdateNodes
  params:
    selectors:
    - conformance/spare: "true"
    state:
      spec:
        unschedulable: false
- id: all-running
  type: CheckPod
  params:
    refTaskId: job
    status: Running
    timeout: 1m
